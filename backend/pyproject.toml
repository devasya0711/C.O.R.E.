[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "core-backend"
version = "0.1.0"
description = "C.O.R.E. orchestration API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "cryptography>=44,<48",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langgraph>=0.6,<1",
    "neo4j>=5.27,<6",
    "networkx>=3.4,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "PyGithub>=2.5,<3",
    "PyJWT[crypto]>=2.10,<3",
    "redis>=5.2,<6",
    "sqlalchemy[asyncio]>=2.0.37,<3",
    "tiktoken>=0.8,<1",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-python>=0.25,<0.26",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
