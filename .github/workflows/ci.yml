name: C.O.R.E. CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        neo4j_plugins: ["[]", '["graph-data-science"]']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: core_test
          POSTGRES_DB: core_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U core_test -d core_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: none
          NEO4J_PLUGINS: ${{ matrix.neo4j_plugins }}
          NEO4J_dbms_security_procedures_unrestricted: gds.*
        ports:
          - 127.0.0.1:7687:7687
        options: >-
          --health-cmd "wget --quiet --spider http://localhost:7474"
          --health-interval 10s --health-timeout 5s --health-retries 18
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://core_test@127.0.0.1:5432/core_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      TEST_NEO4J_URI: bolt://127.0.0.1:7687
      TEST_GDS_EXPECTED: ${{ matrix.neo4j_plugins == '[]' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "backend[dev]"
      - name: Ruff
        run: ruff check backend sample_monolith && ruff format --check backend sample_monolith
      - name: Backend typecheck
        run: mypy --strict --ignore-missing-imports backend/app
      - name: Pytest
        run: PYTHONPATH=. pytest sample_monolith backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend lint and auth unit tests
        working-directory: frontend
        run: npm run lint && npm test
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Production auth smoke tests
        working-directory: frontend
        run: npm run test:smoke
      - name: Verify build did not modify dependency lockfile
        run: git diff --exit-code -- frontend/package-lock.json

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build application images
        run: docker build -t core-backend:ci backend && docker build -t core-frontend:ci frontend
